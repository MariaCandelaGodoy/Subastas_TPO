name: Deploy to Cloud Run
 
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
 
      - uses: google-github-actions/setup-gcloud@v2
 
      - name: Debug - listar contenido de backend
        run: |
          pwd
          ls -la ./backend
 
      - name: Build and push image
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/bidvault-api ./backend
 
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bidvault-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/bidvault-api \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
