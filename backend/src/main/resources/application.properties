spring.application.name=BidVault API
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/bidvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=5090
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origins=*
